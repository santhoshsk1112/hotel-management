services:
  - type: web
    name: hotel-management-system
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /var/data/hotel.db
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1

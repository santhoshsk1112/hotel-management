<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Dashboard - Hotel Dining</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .kitchen-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            padding: 1.5rem;
        }

        .order-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation: slideIn 0.3s ease-out;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.8rem;
        }

        .table-badge {
            background: var(--primary);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .time-badge {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .item-list {
            flex: 1;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 1.1rem;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .item-qty {
            font-weight: bold;
            color: var(--primary);
            margin-right: 0.8rem;
        }

        .ready-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ready-btn:hover {
            background: #059669;
            transform: scale(1.02);
        }

        .ready-btn:active {
            transform: scale(0.98);
        }

        @keyframes slideIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .no-orders {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem;
            color: var(--text-muted);
        }

        .no-orders h1 {
            font-size: 3rem;
            opacity: 0.3;
        }
    </style>
</head>

<body>
    <div class="app-container" style="display: block;">
        <header
            style="padding: 1.5rem; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <h1 style="margin: 0; font-size: 1.8rem;">🔥 Kitchen Display</h1>
                <span id="kitchen-order-count"
                    style="background: var(--primary); color: white; padding: 0.2rem 0.6rem; border-radius: 1rem; font-size: 0.9rem;">0
                    Orders</span>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <span id="refresh-indicator" style="font-size: 0.8rem; color: var(--text-muted);">Syncing...</span>
                <button class="btn" style="width: auto; padding: 0.5rem 1rem;"
                    onclick="location.reload()">Reload</button>
            </div>
        </header>

        <div id="kitchen-grid" class="kitchen-grid">
            <!-- Orders injected here -->
            <div class="no-orders">
                <h1>EMPTY</h1>
                <p>Waiting for new orders from staff...</p>
            </div>
        </div>
    </div>

    <!-- Notification Sound -->
    <audio id="notification-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"
        preload="auto"></audio>

    <script src="js/api.js"></script>
    <script src="js/kitchen.js"></script>
</body>

</html>

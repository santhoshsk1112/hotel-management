<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <span>🍽️ Hotel Dining</span>
            </div>
            <div id="category-list">
                <!-- Categories injected here -->
            </div>
            <div style="margin-top: auto;">
                <button class="btn btn-primary" onclick="showOrdersModal()">View Active Orders</button>
                <button class="nav-item" onclick="window.location.href='kitchen.html'"
                    style="margin-top: 1rem; background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3);">👨‍🍳
                    Kitchen View</button>
                <button class="nav-item" onclick="logout()" style="margin-top: 1rem;">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header"
                style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
                <h2 id="page-title">Menu</h2>
                <div class="search-bar">
                    <!-- Optional Search -->
                </div>
            </div>
            <div id="menu-grid" class="menu-grid">
                <!-- Menu Items injected here -->
            </div>
        </main>

        <!-- Sidebar with Cart and Active Orders -->
        <aside class="cart-sidebar" style="display: flex; flex-direction: column; height: 100vh;">
            <div style="padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1);">
                <h3 id="sidebar-cart-header">New Order</h3>
                <div class="table-selector">
                    <label>Customer Name</label>
                    <input type="text" id="customer-name" class="form-input" placeholder="Guest Name">
                    <label style="margin-top: 1rem;">Table Number</label>
                    <input type="number" id="table-number" class="form-input" min="1" value="1">
                </div>

                <div id="cart-items" class="cart-items" style="max-height: 200px; overflow-y: auto;">
                    <!-- Cart items -->
                    <p style="text-align: center; color: var(--text-muted); margin-top: 2rem;">No items selected</p>
                </div>

                <div class="cart-summary">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; font-weight: 700;">
                        <span>Total</span>
                        <span id="cart-total">₹0.00</span>
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="btn btn-primary" style="flex: 1;" onclick="submitOrder()">Send to
                            Kitchen</button>
                        <button id="cancel-edit-btn" class="btn" style="display: none; background: #94a3b8;"
                            onclick="cancelEditing()">Cancel</button>
                    </div>
                </div>
            </div>

            <div
                style="padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(99, 102, 241, 0.1);">
                <h3 style="margin: 0; color: var(--primary);">Guest Requests</h3>
                <div id="guest-drafts-list" style="margin-top: 1rem;">
                    <!-- Guest drafts injected here -->
                    <p style="text-align: center; color: var(--text-muted); font-size: 0.8rem;">No pending guest orders
                    </p>
                </div>
            </div>

            <div style="flex: 1; padding: 1rem; overflow-y: auto; background: rgba(0,0,0,0.2);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h3 style="margin: 0;">Active Orders</h3>
                    <span id="order-count-badge"
                        style="background: var(--primary); color: white; padding: 0.1rem 0.5rem; border-radius: 1rem; font-size: 0.8rem;">0</span>
                </div>
                <div id="active-orders-list-sidebar">
                    <!-- Active orders injected here -->
                    <p style="text-align: center; color: var(--text-muted); margin-top: 2rem;">No active orders</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- Notification Sound -->
    <audio id="notification-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"
        preload="auto"></audio>

    <!-- Toast Container -->
    <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>

    <!-- Active Orders Modal (kept for backward compatibility or future use) -->
    <div id="orders-modal" class="modal-overlay">
        <div class="modal">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                <h2>Active Orders</h2>
                <button onclick="closeOrdersModal()" class="btn" style="width: auto;">X</button>
            </div>
            <div id="active-orders-list">
                <!-- Active orders -->
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/images.js"></script>
    <script src="js/billing.js"></script>
    <script src="js/staff.js"></script>
    <script>
        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Dining - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth-container">
        <div class="login-card fade-in">
            <h1>TN Delights</h1>
            <p>Hotel Dining Management</p>

            <div style="display: grid; gap: 1rem; margin-bottom: 2rem;">
                <a href="customer.html" class="btn btn-primary"
                    style="text-decoration: none; padding: 1rem; font-size: 1.1rem;">
                    🍽️ Place Order (Guest)
                </a>
            </div>

            <div style="border-top: 1px solid rgba(255,255,255,0.1); margin: 1.5rem 0;"></div>

            <p style="margin-bottom: 1rem; font-size: 0.9rem;">Staff Login</p>
            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" class="form-input" placeholder="admin or staff" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-input" placeholder="password" required>
                </div>
                <button type="submit" class="btn" style="background: rgba(255,255,255,0.1); color: white;">Sign
                    In</button>
            </form>
            <p id="errorMsg" style="color: var(--danger); margin-top: 1rem; font-size: 0.9rem;"></p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await api.login(username, password);
                if (res.success) {
                    localStorage.setItem('user', JSON.stringify(res.user));
                    if (res.user.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'staff.html';
                    }
                } else {
                    errorMsg.textContent = res.message || 'Login failed';
                }
            } catch (err) {
                errorMsg.textContent = 'Server error. Is backend running?';
            }
        });
    </script>
</body>

</html>
